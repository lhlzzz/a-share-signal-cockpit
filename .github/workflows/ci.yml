name: xiaogu-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xiaogu
          POSTGRES_PASSWORD: xiaogu
          POSTGRES_DB: xiaogu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://xiaogu:xiaogu@localhost:5432/xiaogu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q scrapy_scanner scripts xiaogu_*.py
      - run: pytest tests/ -x -q
      - run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from xiaogu_api import app
          client = TestClient(app)
          assert client.get("/health").status_code == 200
          assert client.get("/state").status_code == 200
          for path in ("/decision", "/trades", "/paper/signals", "/paper/performance"):
              assert client.get(path).status_code == 200
          PY

  production_contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xiaogu
          POSTGRES_PASSWORD: xiaogu
          POSTGRES_DB: xiaogu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://xiaogu:xiaogu@localhost:5432/xiaogu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q scrapy_scanner scripts xiaogu_*.py
      - run: pytest tests/test_schema_snapshot_truth.py tests/test_snapshot_identity_lock.py tests/test_production_contract.py tests/test_production_decision.py tests/test_production_hardening.py tests/test_data_contract.py -x -q
      - run: python scripts/xiaogu_daily_health_check.py
