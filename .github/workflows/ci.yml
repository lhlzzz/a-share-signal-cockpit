name: xiaogu-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xiaogu
          POSTGRES_PASSWORD: xiaogu
          POSTGRES_DB: xiaogu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://xiaogu:xiaogu@localhost:5432/xiaogu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q scrapy_scanner scripts xiaogu_*.py
      - run: mkdir -p artifacts
      - run: pytest tests/ -x -q --junitxml=artifacts/test-report.xml
      - run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from xiaogu_api import app
          client = TestClient(app)
          health = client.get("/health")
          assert health.status_code == 200
          assert health.json().get("status") in {"ok", "blocked"}
          assert client.get("/state").status_code == 200
          for path in ("/decision", "/trades", "/positions", "/paper/signals", "/paper/performance"):
              assert client.get(path).status_code == 200
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: artifacts/test-report.xml

  production_contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xiaogu
          POSTGRES_PASSWORD: xiaogu
          POSTGRES_DB: xiaogu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://xiaogu:xiaogu@localhost:5432/xiaogu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q scrapy_scanner scripts xiaogu_*.py
      - run: mkdir -p artifacts
      - run: pytest tests/test_schema_snapshot_truth.py tests/test_snapshot_identity_lock.py tests/test_production_contract.py tests/test_production_decision.py tests/test_production_hardening.py tests/test_data_contract.py -x -q --junitxml=artifacts/production-contract-report.xml
      - name: production run persistence contract
        run: |
          python - <<'PY'
          from xiaogu_db import SCHEMA_VERSION, ensure_production_schema, fetch_production_run, insert_scan_session
          ensure_production_schema()
          lineage_id = "ci-persist-lineage"
          run_id = insert_scan_session(
              trade_date="2026-09-02",
              scan_time="2026-09-02T14:50:00+08:00",
              scan_dir="data/test/production_runs_contract/ci",
              lineage_id=lineage_id,
          )
          assert run_id and run_id != lineage_id
          run = fetch_production_run(run_id)
          assert run is not None
          assert run["production_run_id"] == run_id
          assert str(run["lineage_id"]) == lineage_id
          print("SCHEMA_VERSION", SCHEMA_VERSION)
          print("run_id", run_id)
          PY
      - run: set -o pipefail && python scripts/xiaogu_daily_health_check.py --json | tee artifacts/health-report.json
      - name: production path anti-regressions
        run: |
          if git grep -n -E 'fetch_position_state\(symbol\)|DISTINCT ON\(symbol\)|event_id = source_id|mechanism = evidence_family|CONFIRMED_DISTRIBUTION.*None|daily_paper_position_review.*REPLAY|fetch_decision_snapshot\(prior_id\)' -- '*.py' | grep -E 'xiaogu_forward_runner.py|xiaogu_portfolio_decision.py|xiaogu_forward_features.py|xiaogu_db.py|xiaogu_api.py|xiaogu_core_alpha.py'; then
            echo "forbidden production-path identity fallback detected" >&2
            exit 1
          fi
          if git grep -nE '"PAPER_REDUCE"|paper_action.*=.*PAPER_REDUCE' -- xiaogu_forward_runner.py xiaogu_portfolio_decision.py xiaogu_db.py xiaogu_api.py; then
            echo "production still emits PAPER_REDUCE" >&2
            exit 1
          fi
          if git grep -n 'mode="REPLAY"' -- xiaogu_forward_runner.py | grep daily_paper_position_review; then
            echo "paper review still uses REPLAY" >&2
            exit 1
          fi
          if git grep -n '_capital_evidence_items' -- xiaogu_portfolio_decision.py | grep -E 'CONFIRMED_DISTRIBUTION|distribution_items'; then
            echo "distribution blocker still consumes capital evidence" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-contract-and-health
          path: |
            artifacts/production-contract-report.xml
            artifacts/health-report.json
