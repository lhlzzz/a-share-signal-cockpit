version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: xiaogu
      POSTGRES_USER: xiaogu
      POSTGRES_PASSWORD: xiaogu
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiaogu"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    volumes:
      - ./data:/app/data
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://xiaogu:xiaogu@db:5432/xiaogu
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn xiaogu_api:app --host 0.0.0.0 --port 8000 --reload

  scheduler:
    build: .
    volumes:
      - ./data:/app/data
      - .:/app
    environment:
      DATABASE_URL: postgresql://xiaogu:xiaogu@db:5432/xiaogu
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: python3 xiaogu_scheduler.py

volumes: {}
